[package]
name = "conductloop-desktop-demo"
version = "1.0.0"
description = "ConductLoop Demo — trial/marketing build with fixture data, no personal info"
authors = ["ConductLoop"]
edition = "2021"

[lib]
name = "conductloop_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
