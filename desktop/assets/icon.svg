<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ConductLoop app icon: the site's mark (gradient square, dark disc,
       dashed loop) on Apple's macOS icon grid (824 px body, 100 px margin). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)" filter="url(#shadow)"/>
  <circle cx="512" cy="512" r="330" fill="#0a0a0c"/>
  <circle cx="512" cy="512" r="232" fill="none" stroke="#a78bfa" stroke-width="34"
          stroke-linecap="round" stroke-dasharray="52 39.1" transform="rotate(-90 512 512)"/>
</svg>
