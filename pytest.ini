[pytest]
testpaths = tests
# Put the repo root on sys.path so `ops_dashboard` imports under the bare
# `pytest` console script (not just `python -m pytest`, which adds CWD itself).
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Live tests (marker `live`) never run under a bare `pytest`. The license-worker
# live tests now live in a separate private repository (tests/live, preview/local
# only); nothing in this repo may hit a deployed worker.
addopts = -v --tb=short --strict-markers -m "not live"
markers =
    live: hits the live Cloudflare Worker (requires network)
    slow: tests that take >5 seconds