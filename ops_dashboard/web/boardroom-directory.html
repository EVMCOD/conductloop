<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
<link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Agents Directory — ConductLoop Boardroom</title>
  <link rel="stylesheet" href="/theme.css">
  <style>
    /* Colours come from /theme.css. #fff stays for text on the accent fill: the system has no on-accent ink token. */
    *{box-sizing:border-box}
    body{margin:0;background:var(--cl-bg);color:var(--cl-ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
    h1{font-size:24px;margin:0 0 6px;font-weight:600}
    .sub{color:var(--cl-ink-muted);font-size:13px;margin:0 0 14px}
    .nav{display:flex;gap:8px;margin:14px 0 22px;font-size:13px;flex-wrap:wrap}
    .nav a{color:var(--cl-ink-muted);text-decoration:none;padding:6px 12px;border-radius:8px;border:1px solid transparent}
    .nav a:hover{color:var(--cl-ink);border-color:var(--cl-border)}
    .nav a.active{color:var(--cl-accent-ink);border-color:var(--cl-accent)}
    .filter{margin-bottom:14px;display:flex;gap:8px;align-items:center}
    .filter input{background:var(--cl-bg-soft);border:1px solid var(--cl-border);color:var(--cl-ink);border-radius:8px;padding:8px 12px;font-size:13px;flex:1;max-width:300px}
    table{width:100%;border-collapse:collapse;background:var(--cl-bg-soft);border:1px solid var(--cl-border);border-radius:12px;overflow:hidden;font-size:13px}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--cl-border)}
    th{background:var(--cl-bg-2);font-weight:600;color:var(--cl-ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
    tr:last-child td{border-bottom:0}
    tr:hover td{background:var(--cl-bg-hover)}
    a{color:var(--cl-accent-ink);text-decoration:none}
    a:hover{color:var(--cl-ink)}
    .pill{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--cl-bg-3);border:1px solid var(--cl-border);color:var(--cl-ink-soft)}
    .pill.tier1{background:var(--cl-ok-soft);color:var(--cl-ok);border-color:transparent}
    .pill.tier2{background:var(--cl-accent-soft);color:var(--cl-accent-ink);border-color:transparent}
    .pill.tier3{background:var(--cl-warn-soft);color:var(--cl-warn);border-color:transparent}
    .pill.tier4{background:var(--cl-danger-soft);color:var(--cl-danger);border-color:transparent}
    .status{display:inline-flex;align-items:center;gap:4px;font-size:12px}
    .empty{padding:30px;color:var(--cl-ink-muted);text-align:center}
  </style>
</head>
<body>
<script src="/appearance.js"></script>
<script src="/app-nav.js"></script>
  <div class="wrap">
    <h1 data-i18n="boardroom-directory.title">Agents Directory</h1>
    <p class="sub" data-i18n="boardroom-directory.subtitle">All CEOs at a glance — click a row to open thread, ⚙ to configure autonomy.</p>
    <div class="nav">
      <a href="/boardroom"><span data-i18n="boardroom.nav_inbox">📥 Inbox</span></a>
      <a class="active"><span data-i18n="boardroom.nav_directory">👥 Directory</span></a>
      <a href="/boardroom/vault"><span data-i18n="boardroom.nav_vault">📚 Vault</span></a>
      <a href="/boardroom/portfolio"><span data-i18n="boardroom.nav_portfolio">🌐 Portfolio</span></a>
      <a href="/boardroom/recap"><span data-i18n="boardroom.nav_recap">📊 Daily Recap</span></a>
      <a href="/boardroom/create"><span data-i18n="boardroom.nav_create">+ New CEO</span></a>
    </div>
    <div class="filter">
      <input id="q" type="search" placeholder="Filter by name, project, role…" autocomplete="off" data-i18n-ph="boardroom-directory.filter_ph" />
      <span style="color:var(--cl-ink-muted);font-size:12px" id="count">— CEOs</span>
    </div>
    <table id="table">
      <thead>
        <tr>
          <th data-i18n="boardroom-directory.col_ceo">CEO</th>
          <th data-i18n="boardroom-directory.col_project">Project</th>
          <th data-i18n="boardroom-directory.col_tier">Tier</th>
          <th data-i18n="boardroom-directory.col_maturity">Maturity</th>
          <th data-i18n="boardroom-directory.col_tools">Tools</th>
          <th data-i18n="boardroom-directory.col_status">Status</th>
          <th data-i18n="boardroom-directory.col_messages">Messages</th>
          <th data-i18n="boardroom-directory.col_actions">Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    let items = [];
    // The words of the app: the dictionary when it has arrived, the English
    // text written here when it has not.
    const t = (key, fallback, vars) => (window.BoardroomI18n ? window.BoardroomI18n.t(key, fallback, vars)
      : String(fallback == null ? key : fallback).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined ? vars[k] : m)));
    function esc(s){return (s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function ago(ts){if(!ts)return '—';const m=Math.floor((Date.now()-ts*1000)/60000);if(m<1)return t('boardroom.just_now','just now');if(m<60)return t('boardroom.ago_minutes_short','{n}m',{n:m});const h=Math.floor(m/60);if(h<24)return t('boardroom.ago_hours_short','{n}h',{n:h});const d=Math.floor(h/24);return t('boardroom.ago_days_short','{n}d',{n:d});}
    function statusIcon(s){return ({idle:'🟢',working:'🟢',waiting:'🟡',blocked:'🔴',paused:'⚪',active:'🟢'}[(s||'').toLowerCase()] || '⚪');}

    async function load() {
      try {
        const r = await fetch('/api/boardroom/directory', { credentials:'include' });
        const data = await r.json();
        items = data.items || [];
        render();
      } catch (e) {
        $('tbody').innerHTML = `<tr><td colspan="8" class="empty">${t('boardroom-directory.could_not_load','Could not load.')}</td></tr>`;
      }
    }
    function render() {
      const q = $('q').value.trim().toLowerCase();
      const list = q ? items.filter(c => (c.name+c.role+c.level+(c.project_slug||'')+(c.capabilities||'')).toLowerCase().includes(q)) : items;
      $('count').textContent = `${list.length} CEO${list.length===1?'':'s'}`;
      if (!list.length) { $('tbody').innerHTML = `<tr><td colspan="8" class="empty">${t('boardroom-directory.no_match','No CEOs match.')}</td></tr>`; return; }
      $('tbody').innerHTML = list.map(c => {
        const tier = c.default_tier || '—';
        return `
        <tr>
          <td><a href="/boardroom/ceo/${c.id}"><strong>${esc(c.name)}</strong></a><br/><span style="color:var(--cl-ink-muted);font-size:11px">${esc(c.role || c.level || '')}</span></td>
          <td>${esc(c.project_slug || '—')}</td>
          <td><span class="pill tier${tier}">${t('boardroom-directory.tier_label','Tier {n}',{n:tier})}</span></td>
          <td>${esc(c.maturity_stage || '—')}</td>
          <td>${c.tools_count || 0}</td>
          <td><span class="status">${statusIcon(c.status)} ${esc(c.status||'—')}</span><br/><span style="color:var(--cl-ink-muted);font-size:11px">${ago(c.last_active_at)}</span></td>
          <td>${c.message_count || 0}</td>
          <td>
            <a href="/boardroom/ceo/${c.id}" title="${t('boardroom-directory.open_thread_title','Open thread')}">💬</a>
            &nbsp;
            <a href="/boardroom/autonomy/${c.id}" title="${t('boardroom-directory.configure_autonomy_title','Configure autonomy')}">⚙</a>
          </td>
        </tr>`;
      }).join('');
    }
    $('q').addEventListener('input', render);

    // The words arrive over the network: paint when they are here, and paint
    // again if the person changes the language.
    function start() {
      if (window.BoardroomI18n) {
        BoardroomI18n.ready(load);
        BoardroomI18n.onChange(load);
      } else {
        load();
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  </script>

  <script src="/boardroom-i18n.js" data-i18n-pages="boardroom boardroom-directory" defer></script>
</body>
</html>
