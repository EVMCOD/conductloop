<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/csrf.js" defer></script>
  <script src="/i18n.js" data-i18n-pages="servers" defer></script>
  <script src="/locale-switch.js" data-locale-switch="#controls" defer></script>
  <link rel="stylesheet" href="/theme.css">
  <meta charset="utf-8" />
<link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="servers.doc_title">Servers — ConductLoop</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:var(--cl-bg);color:var(--cl-ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    .wrap{max-width:640px;margin:0 auto;padding:32px 20px 64px}
    h1{font-size:22px;margin:0 0 4px}
    p.sub{color:var(--cl-ink-muted);margin:0 0 24px;font-size:14px}
    .card{background:var(--cl-bg-soft);border:1px solid var(--cl-border);border-radius:14px;padding:18px;margin-bottom:16px}
    .cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
    .cap strong{font-size:15px}
    .what{font-size:12px;color:var(--cl-ink-muted);margin:2px 0 12px}
    .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
    .on{background:var(--cl-ok-soft);color:var(--cl-ok)}
    .off{background:var(--cl-bg-3);color:var(--cl-ink-soft)}
    .warn{background:var(--cl-warn-soft);color:var(--cl-warn)}
    .active{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--cl-bg);border:1px solid var(--cl-border)}
    .active .who{font-size:14px;font-weight:600}
    .where{font-size:12px;color:var(--cl-ink-muted);word-break:break-all;margin-top:2px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--cl-border)}
    .row:last-child{border-bottom:0}
    .name{font-size:13px}
    .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--cl-bg-3);color:var(--cl-ink-soft);margin-left:6px}
    .tag.local{background:var(--cl-accent-soft);color:var(--cl-accent-ink)}
    button{background:var(--cl-accent);color:#fff;border:0;border-radius:999px;padding:7px 18px;font-size:13px;font-weight:500;cursor:pointer}
    button:disabled{opacity:.5}
    button.ghost{background:transparent;color:var(--cl-ink);border:1px solid var(--cl-border)}
    .hint{font-size:12px;color:var(--cl-ink-muted);margin-top:10px}
    a{color:var(--cl-accent-ink)}
  </style>
</head>
<body>
<script src="/appearance.js"></script>
<script src="/app-nav.js"></script>
  <div class="wrap">
    <h1><span data-i18n="servers.title">Servers</span></h1>
    <p class="sub" data-i18n="servers.intro">What this app can talk to, and what is going to answer. The product asks for capabilities — chat, image, video, speech, search — never for a company: a server on this computer, a service in the cloud or any OpenAI-compatible endpoint will do.</p>
    <div id="controls" style="display:flex;gap:14px;margin-bottom:18px;font-size:13px">
      <a href="/ai" data-i18n="servers.nav_connect_ai">Connect AI</a>
      <a href="/media" data-i18n="servers.nav_media">Media</a>
      <a href="/setup" data-i18n="servers.nav_setup">Setup</a>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:18px">
      <button id="check" data-i18n="servers.ask_servers">Ask the servers</button>
      <button id="reload" class="ghost" data-i18n="servers.reload">Reload</button>
    </div>
    <div id="state" class="hint" role="status" style="margin:-8px 0 16px"></div>

    <div id="caps"></div>
  </div>

  <script>
    // The language is the person's choice: the words of this page live in
    // its own dictionary and the page paints them when they arrive.
    const tr = (key, vars) => (window._i18n && window._i18n.t ? window._i18n.t(key, vars) : key);

    let answers = {};

    function el(tag, cls, text){
      const n = document.createElement(tag);
      if(cls) n.className = cls;
      if(text !== undefined && text !== null) n.textContent = text;
      return n;
    }

    function badgeFor(cap, server){
      const answer = answers[cap] && answers[cap][server.name];
      if(answer){
        const b = el('span', 'badge ' + (answer.ok ? 'on' : 'warn'), answer.ok ? tr('servers.answering') : tr('servers.not_answering'));
        b.title = answer.message || '';
        return b;
      }
      // Nothing has asked this server yet: say what is known, and no more.
      if(server.needs_key && !server.key) return el('span', 'badge off', tr('servers.no_key'));
      if(!server.needs_key) return el('span', 'badge off', tr('servers.no_key_needed'));
      return el('span', 'badge on', tr('servers.set_up'));
    }

    function renderCaps(caps){
      const box = document.getElementById('caps');
      box.textContent = '';
      caps.forEach(function(cap){
        const card = el('div', 'card');

        const head = el('div', 'cap');
        head.appendChild(el('strong', null, cap.label));
        const state = cap.state === 'ready' ? tr('servers.cap_ready')
          : (cap.state === 'cooling' ? tr('servers.cooling_down') : tr('servers.not_set_up'));
        head.appendChild(el('span', 'badge ' + (cap.state === 'ready' ? 'on' : 'off'), state));
        card.appendChild(head);
        card.appendChild(el('div', 'what', cap.what));

        const active = cap.active;
        if(active){
          const box2 = el('div', 'active');
          const left = el('div');
          const who = el('div', 'who');
          who.appendChild(document.createTextNode(active.label || active.name));
          if(active.local) who.appendChild(el('span', 'tag local', tr('servers.on_this_computer')));
          if(active.key && active.needs_key) who.appendChild(el('span', 'tag', tr('servers.key_tag', {key: active.key})));
          left.appendChild(who);
          const where = active.where || active.model || '';
          if(where) left.appendChild(el('div', 'where', where));
          if(active.model && active.where) left.appendChild(el('div', 'where', active.model));
          box2.appendChild(left);
          const b = badgeFor(cap.key, active);
          if(b) box2.appendChild(b);
          card.appendChild(box2);
        } else {
          card.appendChild(el('div', 'hint', tr('servers.nothing_set_up')));
        }

        if(cap.fallback){
          card.appendChild(el('div', 'hint',
            tr('servers.default_no_key', {name: cap.fallback.label || cap.fallback.name})));
        }

        const others = (cap.servers || []).filter(function(s){ return !active || s.name !== active.name; });
        if(others.length){
          card.appendChild(el('div', 'what', tr('servers.others_can_serve')));
          others.forEach(function(s){
            const row = el('div', 'row');
            const left = el('div');
            const name = el('div', 'name');
            name.appendChild(document.createTextNode(s.label || s.name));
            if(s.local) name.appendChild(el('span', 'tag local', tr('servers.local')));
            if(s.key && s.needs_key) name.appendChild(el('span', 'tag', tr('servers.key_tag', {key: s.key})));
            left.appendChild(name);
            if(s.where) left.appendChild(el('div', 'where', s.where));
            row.appendChild(left);
            const b = badgeFor(cap.key, s);
            if(b) row.appendChild(b);
            card.appendChild(row);
          });
        }

        if(cap.key === 'embeddings' && typeof cap.total === 'number'){
          card.appendChild(el('div', 'hint', tr('servers.notes_with_vectors', {n: cap.indexed, m: cap.total})));
        }
        if(cap.note) card.appendChild(el('div', 'hint', cap.note));
        box.appendChild(card);
      });
    }

    async function load(){
      const box = document.getElementById('caps');
      try{
        const d = await (await fetch('/api/servers')).json();
        if(!d.ok) throw new Error(d.error || 'failed');
        renderCaps(d.capabilities || []);
      }catch(e){
        box.textContent = '';
        box.appendChild(el('div', 'card', tr('servers.could_not_load', {msg: e.message})));
      }
    }

    document.getElementById('check').onclick = async () => {
      const btn = document.getElementById('check');
      const state = document.getElementById('state');
      btn.disabled = true; state.textContent = tr('servers.asking');
      try{
        const d = await (await fetch('/api/servers/check', {method:'POST'})).json();
        if(!d.ok) throw new Error(d.error || 'failed');
        answers = d.answers || {};
        state.textContent = tr('servers.asked_every');
        await load();
      }catch(e){ state.textContent = '✗ ' + e.message; }
      finally{ btn.disabled = false; }
    };

    document.getElementById('reload').onclick = load;

    // The words arrive over the network: the page paints when they are here,
    // and paints again when the person changes the language.
    function start(){
      load();
      if(window._i18n && window._i18n.onLocaleChange){
        window._i18n.onLocaleChange(function(){ load(); });
      }
    }
    // The words arrive over the network: the page paints when they are here.
    // i18n.js is deferred, so it has run by the time the document is ready.
    function whenWords(){
      var w = window._i18n;
      if(w && w.ready) return w.ready().then(start, start);
      return start();
    }
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenWords);
    else whenWords();
  </script>
</body>
</html>
