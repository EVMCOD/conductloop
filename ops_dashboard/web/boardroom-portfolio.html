<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
<link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Portfolio — ConductLoop Boardroom</title>
  <link rel="stylesheet" href="/theme.css" />
  <style>
    /* Legacy tokens are aliases of the shared design system in /theme.css. */
    :root { --bg: var(--cl-bg); --card: var(--cl-bg-soft); --ink: var(--cl-ink); --muted: var(--cl-ink-muted); --brand: var(--cl-accent); --border: var(--cl-border); --ok: var(--cl-ok); --warn: var(--cl-warn); --bad: var(--cl-danger); }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
    h1{font-size:24px;margin:0 0 6px;font-weight:600}
    .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
    .nav{display:flex;gap:8px;margin:14px 0 22px;font-size:13px;flex-wrap:wrap}
    .nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px;border:1px solid transparent}
    .nav a:hover{color:var(--ink);border-color:var(--border)}
    .nav a.active{color:var(--brand);border-color:var(--brand)}
    .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
    @media (max-width:700px){.kpi-row{grid-template-columns:1fr}}
    .kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
    .kpi .v{font-size:28px;font-weight:700;color:var(--brand);line-height:1}
    .kpi .label{color:var(--muted);font-size:12px;margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
    table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:13px}
    th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border)}
    th{background:var(--cl-bg-soft);font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
    tr:last-child td{border-bottom:0}
    .status{font-size:12px;display:inline-flex;align-items:center;gap:4px}
    a{color:var(--brand);text-decoration:none}
    a:hover{color:#fff;text-decoration:underline}
    .empty{padding:30px;color:var(--muted);text-align:center}
  </style>
</head>
<body>
<script src="/appearance.js"></script>
<script src="/app-nav.js"></script>
  <div class="wrap">
    <h1 data-i18n="boardroom-portfolio.title">Portfolio</h1>
    <p class="sub" data-i18n="boardroom-portfolio.subtitle">Cross-project view — one row per project, its CEO, and recent decisions.</p>
    <div class="nav">
      <a href="/boardroom"><span data-i18n="boardroom.nav_inbox">📥 Inbox</span></a>
      <a href="/boardroom/directory"><span data-i18n="boardroom.nav_directory">👥 Directory</span></a>
      <a href="/boardroom/vault"><span data-i18n="boardroom.nav_vault">📚 Vault</span></a>
      <a class="active"><span data-i18n="boardroom.nav_portfolio">🌐 Portfolio</span></a>
      <a href="/boardroom/recap"><span data-i18n="boardroom.nav_recap">📊 Daily Recap</span></a>
      <a href="/boardroom/create"><span data-i18n="boardroom.nav_create">+ New CEO</span></a>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="v" id="kpi-total">—</div><div class="label" data-i18n="boardroom-portfolio.kpi_projects">Projects</div></div>
      <div class="kpi"><div class="v" id="kpi-ceo">—</div><div class="label" data-i18n="boardroom-portfolio.kpi_with_ceo">With CEO</div></div>
      <div class="kpi"><div class="v" id="kpi-decisions">—</div><div class="label" data-i18n="boardroom-portfolio.kpi_decisions">Audit log entries</div></div>
    </div>
    <table>
      <thead>
        <tr>
          <th data-i18n="boardroom-portfolio.col_project">Project</th>
          <th data-i18n="boardroom-portfolio.col_ceo">CEO</th>
          <th data-i18n="boardroom-portfolio.col_ceo_status">CEO status</th>
          <th data-i18n="boardroom-portfolio.col_last_decision">Last decision</th>
          <th data-i18n="boardroom-portfolio.col_age">Age</th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="5" class="empty" data-i18n="boardroom-portfolio.loading">Loading…</td></tr></tbody>
    </table>
  </div>
  <script>
    // The words of the app: the dictionary when it has arrived, the English
    // text written here when it has not.
    const t = (key, fallback, vars) => (window.BoardroomI18n ? window.BoardroomI18n.t(key, fallback, vars)
      : String(fallback == null ? key : fallback).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined ? vars[k] : m)));
    function esc(s){return (s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function ago(ts){const m=Math.floor((Date.now()-ts*1000)/60000);if(m<1)return t('boardroom.just_now','just now');if(m<60)return t('boardroom.ago_minutes_short','{n}m',{n:m});const h=Math.floor(m/60);if(h<24)return t('boardroom.ago_hours_short','{n}h',{n:h});const d=Math.floor(h/24);return t('boardroom.ago_days_short','{n}d',{n:d});}
    function statusIcon(s){return ({idle:'🟢',working:'🟢',waiting:'🟡',blocked:'🔴',paused:'⚪',active:'🟢'}[(s||'').toLowerCase()] || '⚪');}
    async function load() {
      try {
        const r = await fetch('/api/boardroom/portfolio', { credentials:'include' });
        const data = await r.json();
        render(data);
      } catch (e) {
        document.getElementById('tbody').innerHTML = `<tr><td colspan="5" class="empty">${t('boardroom-portfolio.could_not_load','Could not load.')}</td></tr>`;
      }
    }
    function render(data) {
      const k = data.kpis || {};
      document.getElementById('kpi-total').textContent = k.projects_total ?? '—';
      document.getElementById('kpi-ceo').textContent = k.projects_with_ceo ?? '—';
      document.getElementById('kpi-decisions').textContent = k.projects_with_decisions ?? '—';
      const items = data.projects || [];
      if (!items.length) {
        document.getElementById('tbody').innerHTML = `<tr><td colspan="5" class="empty">${t('boardroom-portfolio.no_projects','No projects discovered.')}</td></tr>`;
        return;
      }
      document.getElementById('tbody').innerHTML = items.map(p => {
        const ceo = p.ceo || {};
        const lastD = p.last_decision || {};
        return `
        <tr>
          <td><strong>${esc(p.name)}</strong><br/><span style="color:var(--muted);font-size:11px">${esc(p.key)}</span></td>
          <td>${ceo.id ? `<a href="/boardroom/ceo/${ceo.id}">${esc(ceo.name)}</a>` : '<span style="color:var(--muted)">' + t('boardroom-portfolio.unassigned','— unassigned —') + '</span>'}</td>
          <td>${ceo.status ? `<span class="status">${statusIcon(ceo.status)} ${esc(ceo.status)}</span>` : '—'}</td>
          <td>${lastD.id ? `<span style="color:var(--muted);font-size:12px">[${esc(lastD.kind||'?')}] ${esc(lastD.title||'')}<br/>${t('boardroom.ago_suffix','{ts} ago',{ts:ago(lastD.created_at)})}</span>` : '<span style="color:var(--muted)">—</span>'}</td>
          <td style="color:var(--muted);font-size:12px">${t('boardroom-portfolio.age_days','{n}d',{n:p.age_days})}</td>
        </tr>`;
      }).join('');
    }

    // The words arrive over the network: paint when they are here, and paint
    // again if the person changes the language.
    function start() {
      if (window.BoardroomI18n) {
        BoardroomI18n.ready(load);
        BoardroomI18n.onChange(load);
      } else {
        load();
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  </script>

  <script src="/boardroom-i18n.js" data-i18n-pages="boardroom boardroom-portfolio" defer></script>
</body>
</html>
