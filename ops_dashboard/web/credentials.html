<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/csrf.js" defer></script>
  <link rel="stylesheet" href="/theme.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Credentials — ConductLoop</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:var(--cl-bg);color:var(--cl-ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    .wrap{max-width:640px;margin:0 auto;padding:32px 20px 64px}
    h1{font-size:22px;margin:0 0 4px}
    p.sub{color:var(--cl-ink-muted);margin:0 0 24px;font-size:14px}
    .card{background:var(--cl-bg-soft);border:1px solid var(--cl-border);border-radius:14px;padding:18px;margin-bottom:16px}
    .card h2{font-size:15px;margin:0 0 2px}
    .card .sub2{font-size:12px;color:var(--cl-ink-muted);margin:0 0 12px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--cl-border)}
    .row:last-child{border-bottom:0}
    .name{font-size:13px}
    .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
    .on{background:var(--cl-ok-soft);color:var(--cl-ok)}
    .off{background:var(--cl-bg-3);color:var(--cl-ink-soft)}
    .warn{background:var(--cl-warn-soft);color:var(--cl-warn)}
    .hint{font-size:12px;color:var(--cl-ink-muted);margin-top:10px}
    label{display:block;font-size:12px;color:var(--cl-ink-muted);margin:12px 0 4px}
    input{width:100%;background:var(--cl-bg);border:1px solid var(--cl-border);color:var(--cl-ink);border-radius:8px;padding:9px 11px;font-size:14px}
    button{background:var(--cl-accent);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
    button:disabled{opacity:.5}
    button.ghost{background:transparent;color:var(--cl-ink);border:1px solid var(--cl-border)}
    button.tiny{padding:5px 10px;font-size:12px;margin:0}
    .form{display:flex;gap:8px;align-items:center;margin-top:8px}
    .form input{flex:1}
    a{color:var(--cl-accent-ink)}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🔐 Credentials</h1>
    <p class="sub">Every key this app holds, and where it is kept. Paste a key here and the app puts it where it belongs — in the keychain of your Mac, or in an encrypted file. The app never shows a key again once it is stored.</p>
    <div style="display:flex;gap:14px;margin-bottom:18px;font-size:13px"><a href="/ai">Connect AI</a><a href="/servers">Servers</a><a href="/connectors">Connectors</a></div>

    <div class="card" id="vault-card">
      <h2 id="vault-title">Where the keys are kept</h2>
      <p class="sub2" id="vault-sub">Loading…</p>
      <div id="vault-body"></div>
    </div>

    <div id="warn"></div>
    <div id="groups"></div>

    <div class="note hint" id="msg" role="status"></div>
  </div>

  <script>
    let state = null;

    function el(tag, cls, text){
      const n = document.createElement(tag);
      if(cls) n.className = cls;
      if(text !== undefined && text !== null) n.textContent = text;
      return n;
    }

    function whereBadge(where){
      if(where === 'keychain') return el('span', 'badge on', 'in the keychain');
      if(where === 'encrypted') return el('span', 'badge on', 'encrypted');
      if(where === 'plaintext') return el('span', 'badge warn', 'in plain text');
      return el('span', 'badge off', 'not set');
    }

    function renderVault(){
      const card = document.getElementById('vault-card');
      const body = document.getElementById('vault-body');
      body.textContent = '';
      const v = state || {};

      if(v.keychain){
        document.getElementById('vault-title').textContent = 'Your Mac keeps the keys';
        document.getElementById('vault-sub').textContent =
          'Everything is stored in the keychain of your Mac: it is encrypted by the system, it does not travel with the app folder, and nothing of it is written in a file you could copy.';
      } else {
        document.getElementById('vault-title').textContent = 'There is no keychain here';
        document.getElementById('vault-sub').textContent =
          'On this machine the keys go into an encrypted file, with a passphrase you choose. It is never stored, so you will be asked for it again next time.';
        const wrap = el('div', 'form');
        const input = document.createElement('input');
        input.type = 'password';
        input.placeholder = 'choose a passphrase';
        input.autocomplete = 'new-password';
        const btn = el('button', null, v.passphrase ? 'Unlock' : 'Create the vault');
        btn.onclick = async () => {
          btn.disabled = true;
          try{
            const r = await fetch('/api/credentials/unlock', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({passphrase: input.value})
            });
            const d = await r.json();
            if(!d.ok) throw new Error(d.message || d.error || 'failed');
            state = d; render();
            document.getElementById('msg').textContent = '✓ The vault is open.';
          }catch(e){ document.getElementById('msg').textContent = '✗ ' + e.message; }
          finally{ btn.disabled = false; }
        };
        wrap.appendChild(input); wrap.appendChild(btn);
        body.appendChild(wrap);
      }
      card.appendChild(el('div', 'hint', v.stored + ' of ' + v.total + ' credentials are stored.'));
    }

    function renderWarning(){
      const box = document.getElementById('warn');
      box.textContent = '';
      const plain = (state && state.plaintext) || [];
      if(!plain.length) return;
      const card = el('div', 'card');
      card.appendChild(el('h2', null, 'Some keys are in plain text'));
      card.appendChild(el('p', 'sub2', 'These are readable by anyone who can read the file they sit in. Moving them takes a second and nothing is lost: ' + plain.join(', ')));
      const btn = el('button', null, 'Move them into the vault');
      btn.onclick = async () => {
        btn.disabled = true;
        try{
          const r = await fetch('/api/credentials/migrate', {method:'POST'});
          const d = await r.json();
          if(!d.ok) throw new Error(d.message || d.error || 'failed');
          state = d; render();
          document.getElementById('msg').textContent = '✓ Moved: ' + ((d.moved || []).join(', ') || 'nothing to move');
        }catch(e){ document.getElementById('msg').textContent = '✗ ' + e.message; }
        finally{ btn.disabled = false; }
      };
      card.appendChild(btn);
      box.appendChild(card);
    }

    function renderGroup(name, title, rows){
      if(!rows.length) return;
      const card = el('div', 'card');
      card.appendChild(el('h2', null, title));
      rows.forEach(function(row){
        const line = el('div', 'row');
        const left = el('div');
        left.appendChild(el('div', 'name', row.label));
        left.appendChild(el('div', 'hint', row.name));
        line.appendChild(left);
        line.appendChild(whereBadge(row.where));
        card.appendChild(line);

        if(row.editable){
          const form = el('div', 'form');
          const input = document.createElement('input');
          input.type = 'password';
          input.placeholder = row.where === 'nowhere' ? 'paste the key' : 'paste a new key to replace it';
          input.autocomplete = 'off';
          const save = el('button', 'tiny', 'Save');
          save.onclick = async () => {
            if(!input.value){ document.getElementById('msg').textContent = '✗ Paste the key first.'; return; }
            save.disabled = true;
            try{
              const r = await fetch('/api/credentials/' + encodeURIComponent(row.name), {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({value: input.value})
              });
              const d = await r.json();
              if(!d.ok) throw new Error(d.message || d.error || 'failed');
              state = d; render();
              document.getElementById('msg').textContent = '✓ Stored in ' + (d.where === 'keychain' ? 'the keychain' : 'the encrypted vault') + '.';
            }catch(e){ document.getElementById('msg').textContent = '✗ ' + e.message; }
            finally{ save.disabled = false; }
          };
          form.appendChild(input); form.appendChild(save);
          if(row.where !== 'nowhere'){
            const rm = el('button', 'tiny ghost', 'Remove');
            rm.onclick = async () => {
              rm.disabled = true;
              try{
                const r = await fetch('/api/credentials/' + encodeURIComponent(row.name), {method:'DELETE'});
                const d = await r.json();
                if(!d.ok) throw new Error(d.message || d.error || 'failed');
                state = d; render();
                document.getElementById('msg').textContent = '✓ Removed.';
              }catch(e){ document.getElementById('msg').textContent = '✗ ' + e.message; }
              finally{ rm.disabled = false; }
            };
            form.appendChild(rm);
          }
          card.appendChild(form);
        }
      });
      document.getElementById('groups').appendChild(card);
    }

    function render(){
      document.getElementById('groups').textContent = '';
      renderVault();
      renderWarning();
      const groups = (state && state.groups) || {};
      const rows = (state && state.rows) || [];
      Object.keys(groups).forEach(function(g){
        renderGroup(g, groups[g], rows.filter(function(r){ return r.group === g; }));
      });
    }

    async function load(){
      try{
        const d = await (await fetch('/api/credentials')).json();
        if(!d.ok) throw new Error(d.message || d.error || 'failed');
        state = d; render();
      }catch(e){
        document.getElementById('vault-sub').textContent = 'Could not load: ' + e.message;
      }
    }
    load();
  </script>
</body>
</html>
