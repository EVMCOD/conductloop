<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/csrf.js" defer></script>
  <script src="/i18n.js" data-i18n-pages="credentials" defer></script>
  <script src="/locale-switch.js" data-locale-switch="#controls" defer></script>
  <link rel="stylesheet" href="/theme.css">
  <meta charset="utf-8" />
<link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="credentials.doc_title">Credentials — ConductLoop</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:var(--cl-bg);color:var(--cl-ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    .wrap{max-width:640px;margin:0 auto;padding:32px 20px 64px}
    h1{font-size:22px;margin:0 0 4px}
    p.sub{color:var(--cl-ink-muted);margin:0 0 24px;font-size:14px}
    .card{background:var(--cl-bg-soft);border:1px solid var(--cl-border);border-radius:14px;padding:18px;margin-bottom:16px}
    .card h2{font-size:15px;margin:0 0 2px}
    .card .sub2{font-size:12px;color:var(--cl-ink-muted);margin:0 0 12px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--cl-border)}
    .row:last-child{border-bottom:0}
    .name{font-size:13px}
    .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
    .on{background:var(--cl-ok-soft);color:var(--cl-ok)}
    .off{background:var(--cl-bg-3);color:var(--cl-ink-soft)}
    .warn{background:var(--cl-warn-soft);color:var(--cl-warn)}
    .hint{font-size:12px;color:var(--cl-ink-muted);margin-top:10px}
    label{display:block;font-size:12px;color:var(--cl-ink-muted);margin:12px 0 4px}
    input{width:100%;background:var(--cl-bg);border:1px solid var(--cl-border);color:var(--cl-ink);border-radius:8px;padding:9px 11px;font-size:14px}
    button{background:var(--cl-accent);color:#fff;border:0;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:500;cursor:pointer}
    button:disabled{opacity:.5}
    button.ghost{background:transparent;color:var(--cl-ink);border:1px solid var(--cl-border)}
    button.tiny{padding:5px 10px;font-size:12px;margin:0}
    .form{display:flex;gap:8px;align-items:center;margin-top:8px}
    .form input{flex:1}
    a{color:var(--cl-accent-ink)}
  </style>
</head>
<body>
<script src="/appearance.js"></script>
<script src="/app-nav.js"></script>
  <div class="wrap">
    <h1><span data-i18n="credentials.title">Credentials</span></h1>
    <p class="sub" data-i18n="credentials.intro">Every key this app holds, and where it is kept. Paste a key here and the app puts it where it belongs — in the keychain of your Mac, or in an encrypted file. The app never shows a key again once it is stored.</p>
    <div id="controls" style="display:flex;gap:14px;margin-bottom:18px;font-size:13px">
      <a href="/ai" data-i18n="credentials.nav_connect_ai">Connect AI</a>
      <a href="/servers" data-i18n="credentials.nav_servers">Servers</a>
      <a href="/connectors" data-i18n="credentials.nav_connectors">Connectors</a>
    </div>

    <div class="card" id="vault-card">
      <h2 id="vault-title" data-i18n="credentials.vault_title">Where the keys are kept</h2>
      <p class="sub2" id="vault-sub" data-i18n="credentials.loading">Loading…</p>
      <div id="vault-body"></div>
    </div>

    <div id="warn"></div>
    <div id="groups"></div>

    <div class="note hint" id="msg" role="status"></div>
  </div>

  <script>
    let state = null;

    // The language is the person's choice: the words of this page live in
    // its own dictionary and the page paints them when they arrive.
    function tr(key, vars){
      if(window._i18n && window._i18n.t) return window._i18n.t(key, vars);
      return key;
    }

    function el(tag, cls, text){
      const n = document.createElement(tag);
      if(cls) n.className = cls;
      if(text !== undefined && text !== null) n.textContent = text;
      return n;
    }

    function whereBadge(where){
      if(where === 'keychain') return el('span', 'badge on', tr('credentials.badge_keychain'));
      if(where === 'encrypted') return el('span', 'badge on', tr('credentials.badge_encrypted'));
      if(where === 'plaintext') return el('span', 'badge warn', tr('credentials.badge_plaintext'));
      return el('span', 'badge off', tr('credentials.badge_not_set'));
    }

    function renderVault(){
      const card = document.getElementById('vault-card');
      const body = document.getElementById('vault-body');
      body.textContent = '';
      const v = state || {};

      if(v.keychain){
        document.getElementById('vault-title').textContent = tr('credentials.vault_title_keychain');
        document.getElementById('vault-sub').textContent = tr('credentials.vault_sub_keychain');
      } else {
        document.getElementById('vault-title').textContent = tr('credentials.vault_title_no_keychain');
        document.getElementById('vault-sub').textContent = tr('credentials.vault_sub_no_keychain');
        const wrap = el('div', 'form');
        const input = document.createElement('input');
        input.type = 'password';
        input.placeholder = tr('credentials.passphrase_ph');
        input.autocomplete = 'new-password';
        const btn = el('button', null, v.passphrase ? tr('credentials.unlock') : tr('credentials.create_vault'));
        btn.onclick = async () => {
          btn.disabled = true;
          try{
            const r = await fetch('/api/credentials/unlock', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({passphrase: input.value})
            });
            const d = await r.json();
            if(!d.ok) throw new Error(d.message || d.error || tr('credentials.failed'));
            state = d; render();
            document.getElementById('msg').textContent = tr('credentials.vault_open');
          }catch(e){ document.getElementById('msg').textContent = '✗ ' + e.message; }
          finally{ btn.disabled = false; }
        };
        wrap.appendChild(input); wrap.appendChild(btn);
        body.appendChild(wrap);
      }
      card.appendChild(el('div', 'hint', tr('credentials.stored_count', {n: v.stored, m: v.total})));
    }

    function renderWarning(){
      const box = document.getElementById('warn');
      box.textContent = '';
      const plain = (state && state.plaintext) || [];
      if(!plain.length) return;
      const card = el('div', 'card');
      card.appendChild(el('h2', null, tr('credentials.plain_title')));
      card.appendChild(el('p', 'sub2', tr('credentials.plain_body') + plain.join(', ')));
      const btn = el('button', null, tr('credentials.move_to_vault'));
      btn.onclick = async () => {
        btn.disabled = true;
        try{
          const r = await fetch('/api/credentials/migrate', {method:'POST'});
          const d = await r.json();
          if(!d.ok) throw new Error(d.message || d.error || tr('credentials.failed'));
          state = d; render();
          document.getElementById('msg').textContent = tr('credentials.moved') +
            ((d.moved || []).join(', ') || tr('credentials.nothing_to_move'));
        }catch(e){ document.getElementById('msg').textContent = '✗ ' + e.message; }
        finally{ btn.disabled = false; }
      };
      card.appendChild(btn);
      box.appendChild(card);
    }

    function renderGroup(name, title, rows){
      if(!rows.length) return;
      const card = el('div', 'card');
      card.appendChild(el('h2', null, title));
      rows.forEach(function(row){
        const line = el('div', 'row');
        const left = el('div');
        left.appendChild(el('div', 'name', row.label));
        left.appendChild(el('div', 'hint', row.name));
        line.appendChild(left);
        line.appendChild(whereBadge(row.where));
        card.appendChild(line);

        if(row.editable){
          const form = el('div', 'form');
          const input = document.createElement('input');
          input.type = 'password';
          input.placeholder = row.where === 'nowhere'
            ? tr('credentials.paste_key_ph') : tr('credentials.paste_new_key_ph');
          input.autocomplete = 'off';
          const save = el('button', 'tiny', tr('credentials.save'));
          save.onclick = async () => {
            if(!input.value){ document.getElementById('msg').textContent = tr('credentials.paste_key_first'); return; }
            save.disabled = true;
            try{
              const r = await fetch('/api/credentials/' + encodeURIComponent(row.name), {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({value: input.value})
              });
              const d = await r.json();
              if(!d.ok) throw new Error(d.message || d.error || tr('credentials.failed'));
              state = d; render();
              const where = d.where === 'keychain'
                ? tr('credentials.stored_in_keychain') : tr('credentials.stored_in_vault');
              document.getElementById('msg').textContent = tr('credentials.stored_ok', {where: where});
            }catch(e){ document.getElementById('msg').textContent = '✗ ' + e.message; }
            finally{ save.disabled = false; }
          };
          form.appendChild(input); form.appendChild(save);
          if(row.where !== 'nowhere'){
            const rm = el('button', 'tiny ghost', tr('credentials.remove'));
            rm.onclick = async () => {
              rm.disabled = true;
              try{
                const r = await fetch('/api/credentials/' + encodeURIComponent(row.name), {method:'DELETE'});
                const d = await r.json();
                if(!d.ok) throw new Error(d.message || d.error || tr('credentials.failed'));
                state = d; render();
                document.getElementById('msg').textContent = tr('credentials.removed_ok');
              }catch(e){ document.getElementById('msg').textContent = '✗ ' + e.message; }
              finally{ rm.disabled = false; }
            };
            form.appendChild(rm);
          }
          card.appendChild(form);
        }
      });
      document.getElementById('groups').appendChild(card);
    }

    function render(){
      document.getElementById('groups').textContent = '';
      renderVault();
      renderWarning();
      const groups = (state && state.groups) || {};
      const rows = (state && state.rows) || [];
      Object.keys(groups).forEach(function(g){
        renderGroup(g, groups[g], rows.filter(function(r){ return r.group === g; }));
      });
    }

    async function load(){
      try{
        const d = await (await fetch('/api/credentials')).json();
        if(!d.ok) throw new Error(d.message || d.error || tr('credentials.failed'));
        state = d; render();
      }catch(e){
        document.getElementById('vault-sub').textContent = tr('credentials.could_not_load', {msg: e.message});
      }
    }

    // The words arrive over the network: the page paints when they are here,
    // and paints again when the person changes the language.
    function start(){
      load();
      if(window._i18n && window._i18n.onLocaleChange){
        window._i18n.onLocaleChange(function(){ render(); });
      }
    }
    // The words arrive over the network: the page paints when they are here.
    // i18n.js is deferred, so it has run by the time the document is ready.
    function whenWords(){
      var w = window._i18n;
      if(w && w.ready) return w.ready().then(start, start);
      return start();
    }
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whenWords);
    else whenWords();
  </script>
</body>
</html>
