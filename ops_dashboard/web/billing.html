<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConductLoop — Free edition</title>
  <meta name="description" content="ConductLoop is free. Every feature unlocked." />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root{--bg:#0f172a;--bg-soft:#1e293b;--bg-card:#1a2332;--border:#334155;--ink:#f1f5f9;--muted:#94a3b8;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--gold:#fbbf24}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
    .container{max-width:960px;margin:0 auto;padding:48px 24px 80px}
    .hero{text-align:center;margin-bottom:56px}
    h1{font-size:42px;margin:0 0 12px 0;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--ink) 0%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .tagline{color:var(--muted);font-size:18px;margin:0}
    .cta{display:inline-block;background:var(--gold);color:var(--bg);padding:16px 48px;border-radius:10px;font-size:16px;font-weight:700;border:none;cursor:pointer;text-decoration:none;letter-spacing:0.5px;transition:transform 0.1s}
    .cta:hover{transform:translateY(-2px)}
    .status{padding:12px 16px;border-radius:8px;margin-top:20px;font-size:14px}
    .status.info{background:rgba(59,130,246,0.1);border:1px solid var(--blue);color:var(--blue)}
    .lang-picker{position:absolute;top:20px;right:20px;background:var(--bg-soft);color:var(--ink);border:1px solid var(--border);padding:6px 10px;border-radius:4px;font-size:12px}
    .footer{text-align:center;margin-top:48px;color:var(--muted);font-size:12px}
    .footer a{color:var(--blue);text-decoration:none}
  </style>
</head>
<body>
  <select id="locale-picker" class="lang-picker">
    <option value="en">English</option>
  </select>

  <div class="container">
    <div class="hero">
      <h1 data-i18n="app.name">ConductLoop</h1>
      <p class="tagline" data-i18n="app.tagline">Your second brain</p>
    </div>

    <!-- 2026-10-21: ConductLoop is free. No plans, prices or payments.
         Founders (pre-free beta) keep their badge, without any price. -->
    <div id="content" style="max-width:560px;margin:24px auto 0;text-align:center">
      <div id="founder-badge" hidden style="border:1.5px solid var(--gold);border-radius:12px;padding:18px 20px;margin-bottom:20px">
        <div style="display:inline-block;background:var(--gold);color:var(--bg);padding:4px 14px;border-radius:10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px">
          ★ <span data-i18n="billing.founding_member">Founding member</span>
        </div>
        <div style="margin-top:10px;font-size:15px" data-i18n="billing.founding_thanks_free">Thank you for supporting ConductLoop early.</div>
      </div>
      <div style="border:2px solid var(--gold);border-radius:14px;padding:32px">
        <div style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px" data-i18n="billing.free_edition_name">Free edition</div>
        <p style="font-size:16px;margin:0 0 24px 0" data-i18n="billing.free_edition_tagline">Every feature is unlocked. No trial, no subscription, no payment.</p>
        <a href="/" class="cta" data-i18n="billing.open_app">Open ConductLoop</a>
      </div>
    </div>

    <div class="footer">
      <p>© 2026 ConductLoop</p>
      <p><a href="/status">System status</a> · <a href="/">Dashboard</a></p>
    </div>
  </div>

  <script src="i18n.js?v=7"></script>
  <script>
    const tr = (k, vars) => window._i18n.t(k, vars);

    async function applyTranslations(locale) {
      await window._i18n.setLocale(locale);
      document.documentElement.lang = locale;
      document.querySelectorAll('[data-i18n]').forEach(function(node) {
        const k = node.getAttribute('data-i18n');
        const v = tr(k);
        if (v !== k) node.textContent = v;
      });
      document.getElementById('locale-picker').value = locale;
    }

    async function showFounderBadge() {
      try {
        const r = await fetch('/api/auth/me', { credentials: 'include' });
        const me = await r.json();
        if (me && me.is_founder) document.getElementById('founder-badge').hidden = false;
      } catch (e) { /* signed out or offline: nothing to show */ }
    }

    const initialLocale = (() => {
      try {
        const stored = localStorage.getItem('ops-dashboard.locale');
        if (stored) return stored;
      } catch (e) {}
      return (navigator.language || 'en').slice(0, 2);
    })();
    document.getElementById('locale-picker').addEventListener('change', function(e) {
      try { localStorage.setItem('ops-dashboard.locale', e.target.value); } catch (err) {}
      applyTranslations(e.target.value);
    });
    applyTranslations(initialLocale).then(showFounderBadge);
  </script>
</body>
</html>
