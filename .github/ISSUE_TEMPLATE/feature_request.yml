name: Feature request
description: Suggest an idea or an improvement for ConductLoop.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For anything larger than a small change, discussing it here before writing code saves everyone time (see [CONTRIBUTING.md](https://github.com/EVMCOD/conductloop/blob/main/CONTRIBUTING.md)).
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How should it work from the user's point of view?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Indexing / search
        - Brain / chat
        - Agents / sessions
        - Connectors / MCP
        - Vault / notes
        - Desktop app / updater
        - Other / not sure
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with the project
      description: ConductLoop is local-first and bring-your-own-key.
      options:
        - label: It works without sending data to a ConductLoop server (local-first, BYOK).
        - label: I would be willing to help test it or send a pull request.
