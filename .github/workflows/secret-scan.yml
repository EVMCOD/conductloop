name: Secret scan

# Runs gitleaks on every PR and on pushes to main.
#
# Scope: ONLY the commits introduced by the PR / push, not the whole history.
# Why: the existing history (pre-2026-10) contains a known gitleaks finding that
# is a false positive (a dummy expired JWT used by tests/test_license_worker.py
# to assert the worker rejects expired tokens) plus personal data in old commits
# that is being handled separately (see the public-readiness report). Scanning the
# full history would fail every run without telling us anything new, and we do
# NOT want to silence it with an allowlist/.gitleaksignore entry. New commits are
# scanned with the default ruleset and no allowlist, so any new secret fails CI.
# A full-history scan can still be run manually (workflow_dispatch, advisory).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned release + checksum check)
        run: |
          set -euo pipefail
          V="$GITLEAKS_VERSION"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL -o "gitleaks_${V}_linux_x64.tar.gz" "${base}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks version

      - name: Scan new commits (blocking)
        if: github.event_name != 'workflow_dispatch'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "$PR_BASE" "$PR_HEAD")"
            range="${base}..${PR_HEAD}"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            # Force-push or unknown previous tip: scan every commit not already
            # on another branch of the remote, not just the tip.
            git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' >/dev/null 2>&1 || true
            others="$(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -v -E "/(${GITHUB_REF_NAME}|HEAD)\$" || true)"
            if [ -n "$others" ]; then
              range="${PUSH_AFTER} --not ${others}"
            else
              range="${PUSH_AFTER}"
            fi
          fi
          echo "Scanning commit range: ${range}"
          # ${range} is unquoted on purpose: it can hold several git log args
          # (e.g. "<sha> --not <refs>").
          # shellcheck disable=SC2086
          git log --oneline ${range} | cat
          ./gitleaks git --log-opts="${range}" --redact --no-banner --verbose --exit-code 1 .

      - name: Full-history scan (manual, advisory)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: ./gitleaks git --log-opts="--all" --redact --no-banner --exit-code 1 .
