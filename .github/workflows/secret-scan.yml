name: Secret scan

# Runs gitleaks on every PR and on pushes to main, over the FULL history
# (fetch-depth: 0, every ref), default ruleset, no allowlist and no
# .gitleaksignore: a secret anywhere in the public history fails the run.
# Scanning everything is cheap (seconds). The history of this repository was
# scanned clean when this was made blocking; if a finding ever shows up, do not
# rewrite history to hide it: rotate the credential and decide what to do.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned release + checksum check)
        run: |
          set -euo pipefail
          V="$GITLEAKS_VERSION"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL -o "gitleaks_${V}_linux_x64.tar.gz" "${base}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks version

      - name: Scan the full history (blocking)
        run: ./gitleaks git --log-opts="--all" --redact --no-banner --verbose --exit-code 1 .
